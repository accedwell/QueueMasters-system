spring.application.name=backend

# ---------- PostgreSQL ----------
# Defaults match backend/db/setup.sql. Override any of them with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) instead of editing this file, e.g. in start.bat or a .env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queuemasters}
spring.datasource.username=${DB_USERNAME:queuemasters}
spring.datasource.password=${DB_PASSWORD:queuemasters123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the tables (app_user, vehicle, sale_record) automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Connection pool: small system, keep it light.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
