spring.application.name=backend

# Hosting platforms (Render, Railway, Heroku...) tell the app which port to listen on via PORT.
server.port=${PORT:8080}

# ---------- PostgreSQL ----------
# Defaults match backend/db/setup.sql. Override with environment variables instead of editing this file:
#   DB_URL (full JDBC URL)  -or-  DB_HOST / DB_PORT / DB_NAME, plus DB_USERNAME / DB_PASSWORD.
# render.yaml wires these to Render's managed database automatically.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:queuemasters}}
spring.datasource.username=${DB_USERNAME:queuemasters}
spring.datasource.password=${DB_PASSWORD:queuemasters123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the tables (app_user, vehicle, sale_record) automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Connection pool: small system, keep it light.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# Browser origins allowed to call the API (comma-separated). Set CORS_ALLOWED_ORIGINS in production
# to the deployed frontend, e.g. https://queuemasters.vercel.app,https://*.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
