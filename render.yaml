# Render Blueprint: deploys the Spring Boot API + a managed PostgreSQL database.
# Dashboard -> New -> Blueprint -> pick this GitHub repo. Render reads this file.
# The React frontend is hosted on Vercel (see frontend/vercel.json and README "Deploy").
services:
  - type: web
    name: queuemasters-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase: { name: queuemasters-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: queuemasters-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: queuemasters-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: queuemasters-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: queuemasters-db, property: password }
      # Comma-separated list of browser origins allowed to call the API:
      # the production site plus Vercel preview deployments of this project.
      - key: CORS_ALLOWED_ORIGINS
        value: https://queuemasters-alpha.vercel.app,https://queuemasters-*-accedwell.vercel.app

databases:
  - name: queuemasters-db
    plan: free
    databaseName: queuemasters
    user: queuemasters
